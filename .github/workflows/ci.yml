name: Offline reference analyses
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-tested.txt
      - run: pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: babyconceptlm-analysis reproduce --reference-dir examples/reference --output-dir outputs/reference
      - run: python scripts/check_release.py
